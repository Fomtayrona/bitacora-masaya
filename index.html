<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bitácora Masaya - Login</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
    body { background-color: #1a252f; color: #333; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    
    .card { background: white; width: 100%; max-width: 400px; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center; }
    h1 { color: #1a252f; font-size: 22px; margin-bottom: 6px; font-weight: 700; }
    p.subtitle { color: #666; font-size: 13px; margin-bottom: 20px; }

    /* Selección de Hotel y Usuario */
    .form-group { text-align: left; margin-bottom: 15px; }
    label { font-size: 12px; font-weight: 600; color: #555; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 6px; }
    select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; outline: none; background: #fff; cursor: pointer; }
    select:focus { border-color: #007bff; }

    /* Pantalla PIN */
    .pin-display { display: flex; justify-content: center; gap: 12px; margin: 20px 0; }
    .pin-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #ccc; transition: all 0.2s; }
    .pin-dot.filled { background-color: #1a252f; border-color: #1a252f; }

    /* Teclado Numérico */
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 15px; }
    .key { background: #f4f6f8; border: none; padding: 18px 0; font-size: 20px; font-weight: 600; border-radius: 10px; cursor: pointer; color: #1a252f; transition: background 0.1s; }
    .key:active { background: #e2e8f0; }
    .key.action { font-size: 14px; background: #fee2e2; color: #991b1b; }

    .user-badge { background: #e0f2fe; color: #0369a1; padding: 8px 12px; border-radius: 6px; font-weight: 600; font-size: 14px; margin-bottom: 15px; display: inline-block; }
    .error-msg { color: #dc2626; font-size: 13px; margin-top: 10px; min-height: 18px; font-weight: 500; }
    .btn-back { background: none; border: none; color: #64748b; font-size: 13px; cursor: pointer; margin-top: 15px; text-decoration: underline; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Bitácora Masaya</h1>
    <p class="subtitle">Control Operacional Recepción</p>

    <!-- PASO 1: Selección de Hotel y Usuario -->
    <div id="step-select">
      <div class="form-group">
        <label>1. Selecciona Hotel</label>
        <select id="hotel-select" onchange="loadUsers()"><option value="">Cargando hoteles...</option></select>
      </div>

      <div class="form-group">
        <label>2. Selecciona tu Usuario</label>
        <select id="user-select" disabled><option value="">Primero selecciona hotel</option></select>
      </div>
    </div>

    <!-- PASO 2: Teclado PIN -->
    <div id="step-pin" style="display: none;">
      <div id="selected-user-name" class="user-badge"></div>
      <p style="font-size: 13px; color: #666;">Ingresa tu PIN de 4 dígitos:</p>
      
      <div class="pin-display">
        <div class="pin-dot" id="dot-0"></div>
        <div class="pin-dot" id="dot-1"></div>
        <div class="pin-dot" id="dot-2"></div>
        <div class="pin-dot" id="dot-3"></div>
      </div>

      <div class="keypad">
        <button class="key" onclick="pressKey('1')">1</button>
        <button class="key" onclick="pressKey('2')">2</button>
        <button class="key" onclick="pressKey('3')">3</button>
        <button class="key" onclick="pressKey('4')">4</button>
        <button class="key" onclick="pressKey('5')">5</button>
        <button class="key" onclick="pressKey('6')">6</button>
        <button class="key" onclick="pressKey('7')">7</button>
        <button class="key" onclick="pressKey('8')">8</button>
        <button class="key" onclick="pressKey('9')">9</button>
        <button class="key action" onclick="clearPin()">C</button>
        <button class="key" onclick="pressKey('0')">0</button>
        <button class="key action" onclick="deleteLastPin()">⌫</button>
      </div>

      <button class="btn-back" onclick="resetFlow()">← Cambiar de usuario</button>
    </div>

    <!-- PANTALLA EXITO -->
    <div id="step-success" style="display: none;">
      <div style="font-size: 48px; margin-bottom: 10px;">🎉</div>
      <h2 style="color: #166534; font-size: 20px; margin-bottom: 8px;">¡Acceso Correcto!</h2>
      <p id="welcome-msg" style="font-size: 14px; color: #475569; margin-bottom: 20px;"></p>
      <button onclick="resetFlow()" style="padding: 10px 20px; border: none; background: #1a252f; color: white; border-radius: 8px; cursor: pointer;">Cerrar Sesión</button>
    </div>

    <div id="error-msg" class="error-msg"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://tsxecbjacdblbxprobdi.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_awz6uY_HmS1o3mf7Pgh55A_kAjbGfRQ';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentPin = "";
    let selectedUser = null;
    let allUsers = [];

    async function initApp() {
      const { data: hotels, error } = await _supabase.from('hotels').select('*');
      if (error) { showError("Error al cargar hoteles."); return; }

      const hotelSelect = document.getElementById('hotel-select');
      hotelSelect.innerHTML = '<option value="">-- Seleccionar --</option>' + 
        hotels.map(h => `<option value="${h.id}">${h.name}</option>`).join('');

      const { data: users, error: userError } = await _supabase.from('users').select('*');
      if (!userError) allUsers = users;
    }

    function loadUsers() {
      const hotelId = document.getElementById('hotel-select').value;
      const userSelect = document.getElementById('user-select');
      
      if (!hotelId) {
        userSelect.innerHTML = '<option value="">Primero selecciona hotel</option>';
        userSelect.disabled = true;
        return;
      }

      const filteredUsers = allUsers.filter(u => u.hotel_id === hotelId);
      if (filteredUsers.length === 0) {
        userSelect.innerHTML = '<option value="">Sin usuarios en este hotel</option>';
        userSelect.disabled = true;
        return;
      }

      userSelect.innerHTML = '<option value="">-- Seleccionar Usuario --</option>' +
        filteredUsers.map(u => `<option value="${u.id}">${u.display_name || u.full_name}</option>`).join('');
      
      userSelect.disabled = false;
      userSelect.onchange = selectUser;
    }

    function selectUser() {
      const userId = document.getElementById('user-select').value;
      if (!userId) return;

      selectedUser = allUsers.find(u => u.id === userId);
      document.getElementById('selected-user-name').innerText = `👤 ${selectedUser.display_name || selectedUser.full_name}`;
      
      document.getElementById('step-select').style.display = 'none';
      document.getElementById('step-pin').style.display = 'block';
      clearPin();
    }

    function pressKey(num) {
      if (currentPin.length < 4) {
        currentPin += num;
        updatePinDots();
        if (currentPin.length === 4) validatePin();
      }
    }

    function deleteLastPin() {
      currentPin = currentPin.slice(0, -1);
      updatePinDots();
    }

    function clearPin() {
      currentPin = "";
      updatePinDots();
      showError("");
    }

    function updatePinDots() {
      for (let i = 0; i < 4; i++) {
        const dot = document.getElementById(`dot-${i}`);
        if (i < currentPin.length) dot.classList.add('filled');
        else dot.classList.remove('filled');
      }
    }

    function validatePin() {
      if (currentPin === selectedUser.pin) {
        document.getElementById('step-pin').style.display = 'none';
        document.getElementById('step-success').style.display = 'block';
        document.getElementById('welcome-msg').innerText = `Bienvenido(a), ${selectedUser.full_name} (${selectedUser.role})`;
      } else {
        showError("❌ PIN Incorrecto. Intenta de nuevo.");
        setTimeout(() => clearPin(), 800);
      }
    }

    function resetFlow() {
      currentPin = "";
      selectedUser = null;
      document.getElementById('hotel-select').value = "";
      document.getElementById('user-select').value = "";
      document.getElementById('user-select').disabled = true;
      document.getElementById('step-pin').style.display = 'none';
      document.getElementById('step-success
