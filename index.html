<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bitácora Masaya - Control de Acceso</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
    body { background-color: #1a252f; color: #333; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    
    .card { background: white; width: 100%; max-width: 480px; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center; }
    .card.wide { max-width: 750px; text-align: left; }
    
    h1 { color: #1a252f; font-size: 22px; margin-bottom: 6px; font-weight: 700; text-align: center; }
    p.subtitle { color: #666; font-size: 13px; margin-bottom: 20px; text-align: center; }

    .form-group { text-align: left; margin-bottom: 15px; }
    label { font-size: 12px; font-weight: 600; color: #555; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 6px; }
    select, input { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; outline: none; background: #fff; }
    select:focus, input:focus { border-color: #007bff; }

    .pin-display { display: flex; justify-content: center; gap: 12px; margin: 20px 0; }
    .pin-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #ccc; transition: all 0.2s; }
    .pin-dot.filled { background-color: #1a252f; border-color: #1a252f; }

    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 15px; }
    .key { background: #f4f6f8; border: none; padding: 18px 0; font-size: 20px; font-weight: 600; border-radius: 10px; cursor: pointer; color: #1a252f; }
    .key:active { background: #e2e8f0; }
    .key.action { font-size: 14px; background: #fee2e2; color: #991b1b; }

    .user-badge { background: #e0f2fe; color: #0369a1; padding: 8px 12px; border-radius: 6px; font-weight: 600; font-size: 14px; margin-bottom: 15px; display: inline-block; }
    .error-msg { color: #dc2626; font-size: 13px; margin-top: 15px; min-height: 18px; font-weight: 500; background: #fef2f2; padding: 8px; border-radius: 6px; display: none; text-align: center; }
    .success-msg { color: #166534; font-size: 13px; margin-top: 15px; background: #f0fdf4; padding: 8px; border-radius: 6px; display: none; text-align: center; }
    
    .btn-back { background: none; border: none; color: #64748b; font-size: 13px; cursor: pointer; margin-top: 15px; text-decoration: underline; width: 100%; text-align: center; }
    .btn-primary { background: #1a252f; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 10px; }

    .grid-form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
    th, td { padding: 10px; border-bottom: 1px solid #e2e8f0; text-align: left; }
    th { background: #f8fafc; color: #475569; font-weight: 600; }
    .badge-role { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
    .badge-admin { background: #fef3c7; color: #92400e; }
    .badge-op { background: #e0e7ff; color: #3730a3; }
    .btn-sm { padding: 4px 8px; font-size: 11px; border-radius: 4px; border: none; cursor: pointer; }
    .btn-danger { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>

  <div id="main-card" class="card">
    <h1>Bitácora Masaya</h1>
    <p class="subtitle">Control Operacional Recepción</p>

    <!-- PASO 1: Selección -->
    <div id="step-select">
      <div class="form-group">
        <label>1. Selecciona Hotel</label>
        <select id="hotel-select" onchange="loadUsers()"><option value="">Cargando hoteles...</option></select>
      </div>

      <div class="form-group">
        <label>2. Selecciona tu Usuario</label>
        <select id="user-select" disabled><option value="">Primero selecciona hotel</option></select>
      </div>
    </div>

    <!-- PASO 2: Teclado PIN -->
    <div id="step-pin" style="display: none;">
      <div id="selected-user-name" class="user-badge"></div>
      <p style="font-size: 13px; color: #666;">Ingresa tu PIN de 4 dígitos:</p>
      
      <div class="pin-display">
        <div class="pin-dot" id="dot-0"></div>
        <div class="pin-dot" id="dot-1"></div>
        <div class="pin-dot" id="dot-2"></div>
        <div class="pin-dot" id="dot-3"></div>
      </div>

      <div class="keypad">
        <button class="key" onclick="pressKey('1')">1</button>
        <button class="key" onclick="pressKey('2')">2</button>
        <button class="key" onclick="pressKey('3')">3</button>
        <button class="key" onclick="pressKey('4')">4</button>
        <button class="key" onclick="pressKey('5')">5</button>
        <button class="key" onclick="pressKey('6')">6</button>
        <button class="key" onclick="pressKey('7')">7</button>
        <button class="key" onclick="pressKey('8')">8</button>
        <button class="key" onclick="pressKey('9')">9</button>
        <button class="key action" onclick="clearPin()">C</button>
        <button class="key" onclick="pressKey('0')">0</button>
        <button class="key action" onclick="deleteLastPin()">⌫</button>
      </div>

      <button class="btn-back" onclick="resetFlow()">← Cambiar de usuario</button>
    </div>

    <!-- PASO 3: Sesión / Panel Admin -->
    <div id="step-session" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px;">
        <div>
          <span id="session-user" style="font-weight: 700; color: #1a252f;"></span>
          <span id="session-role" class="badge-role badge-op" style="margin-left: 6px;"></span>
        </div>
        <button onclick="resetFlow()" class="btn-sm btn-danger">Cerrar Sesión</button>
      </div>

      <!-- VISTA ADMIN -->
      <div id="admin-panel" style="display: none;">
        <h3 style="font-size: 15px; margin-bottom: 12px; color: #1a252f;">➕ Crear Nuevo Usuario</h3>
        <form onsubmit="createUser(event)">
          <div class="grid-form">
            <div class="form-group">
              <label>Hotel</label>
              <select id="new-user-hotel" required></select>
            </div>
            <div class="form-group">
              <label>Nombre Completo</label>
              <input type="text" id="new-user-fullname" placeholder="Ej: Maria Perez" required />
            </div>
            <div class="form-group">
              <label>Nombre Display</label>
              <input type="text" id="new-user-display" placeholder="Ej: Maria P." required />
            </div>
            <div class="form-group">
              <label>Email</label>
              <input type="email" id="new-user-email" placeholder="maria@masaya.com" required />
            </div>
            <div class="form-group">
              <label>Rol</label>
              <select id="new-user-role">
                <option value="OPERATIVO">OPERATIVO</option>
                <option value="ADMIN">ADMIN</option>
              </select>
            </div>
            <div class="form-group">
              <label>PIN (4 dígitos)</label>
              <input type="password" id="new-user-pin" maxlength="4" pattern="\d{4}" placeholder="1234" required />
            </div>
          </div>
          <button type="submit" class="btn-primary">Guardar Usuario</button>
        </form>

        <h3 style="font-size: 15px; margin: 20px 0 10px 0; color: #1a252f;">👥 Colaboradores Registrados</h3>
        <table>
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Rol</th>
              <th>PIN</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="users-table-body"></tbody>
        </table>
      </div>

      <!-- VISTA OPERATIVO -->
      <div id="operator-panel" style="display: none; text-align: center; padding: 20px 0;">
        <div style="font-size: 40px; margin-bottom: 10px;">📋</div>
        <h3>Módulo de Novedades</h3>
        <p style="font-size: 13px; color: #666; margin-top: 6px;">Próximamente: Registro e historial de turno.</p>
      </div>
    </div>

    <div id="error-msg" class="error-msg"></div>
    <div id="success-msg" class="success-msg"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://tsxecbjacdblbxprobdi.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_awz6uY_HmS1o3mf7Pgh55A_kAjbGfRQ';
    let _supabase;

    let currentPin = "";
    let selectedUser = null;
    let allUsers = [];
    let allHotels = [];

    async function initApp() {
      try {
        _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 1. Cargar hoteles primero
        const { data: hotels, error: hErr } = await _supabase.from('hotels').select('*');
        if (hErr) throw hErr;
        allHotels = hotels || [];

        const hotelSelect = document.getElementById('hotel-select');
        const newUserHotel = document.getElementById('new-user-hotel');

        if (allHotels.length === 0) {
          hotelSelect.innerHTML = '<option value="">No hay hoteles</option>';
          return;
        }

        const optionsHtml = '<option value="">-- Seleccionar --</option>' + 
          allHotels.map(h => `<option value="${h.id}">${h.name}</option>`).join('');

        hotelSelect.innerHTML = optionsHtml;
        newUserHotel.innerHTML = optionsHtml;

        // 2. Cargar usuarios de fondo
        refreshUsers();

      } catch (err) {
        showError("Error de carga: " + err.message);
      }
    }

    async function refreshUsers() {
      const { data: users, error } = await _supabase.from('users').select('*');
      if (error) {
        showError("Error al cargar usuarios: " + error.message);
      } else {
        allUsers = users || [];
      }
    }

    function loadUsers() {
      const hotelId = document.getElementById('hotel-select').value;
      const userSelect = document.getElementById('user-select');
      
      if (!hotelId) {
        userSelect.innerHTML = '<option value="">Primero selecciona hotel</option>';
        userSelect.disabled = true;
        return;
      }

      const filteredUsers = allUsers.filter(u => u.hotel_id === hotelId && u.is_active !== false);
      if (filteredUsers.length === 0) {
        userSelect.innerHTML = '<option value="">Sin usuarios registrados en esta sede</option>';
        userSelect.disabled = true;
        return;
      }

      userSelect.innerHTML = '<option value="">-- Seleccionar Usuario --</option>' +
        filteredUsers.map(u => `<option value="${u.id}">${u.display_name || u.full_name}</option>`).join('');
      
      userSelect.disabled = false;
      userSelect.onchange = selectUser;
    }

    function selectUser() {
      const userId = document.getElementById('user-select').value;
      if (!userId) return;

      selectedUser = allUsers.find(u => u.id === userId);
      document.getElementById('selected-user-name').innerText = `👤 ${selectedUser.display_name || selectedUser.full_name}`;
      
      document.getElementById('step-select').style.display = 'none';
      document.getElementById('step-pin').style.display = 'block';
      clearPin();
    }

    function pressKey(num) {
      if (currentPin.length < 4) {
        currentPin += num;
        updatePinDots();
        if (currentPin.length === 4) validatePin();
      }
    }

    function deleteLastPin() {
      currentPin = currentPin.slice(0, -1);
      updatePinDots();
    }

    function clearPin() {
      currentPin = "";
      updatePinDots();
      hideMsgs();
    }

    function updatePinDots() {
      for (let i = 0; i < 4; i++) {
        const dot = document.getElementById(`dot-${i}`);
        if (i < currentPin.length) dot.classList.add('filled');
        else dot.classList.remove('filled');
      }
    }

    function validatePin() {
      if (currentPin === selectedUser.pin) {
        openSession();
      } else {
        showError("❌ PIN Incorrecto");
        setTimeout(() => clearPin(), 800);
      }
    }

    function openSession() {
      document.getElementById('step-pin').style.display = 'none';
      document.getElementById('step-session').style.display = 'block';
      document.getElementById('main-card').classList.add('wide');

      document.getElementById('session-user').innerText = selectedUser.display_name || selectedUser.full_name;
      const roleBadge = document.getElementById('session-role');
      roleBadge.innerText = selectedUser.role;
      roleBadge.className = `badge-role ${selectedUser.role === 'ADMIN' ? 'badge-admin' : 'badge-op'}`;

      if (selectedUser.role === 'ADMIN') {
        document.getElementById('admin-panel').style.display = 'block';
        document.getElementById('operator-panel').style.display = 'none';
        renderUsersTable();
      } else {
        document.getElementById('admin-panel').style.display = 'none';
        document.getElementById('operator-panel').style.display = 'block';
      }
    }

    async function createUser(e) {
      e.preventDefault();
      hideMsgs();

      const newUser = {
        hotel_id: document.getElementById('new-user-hotel').value,
        full_name: document.getElementById('new-user-fullname').value,
        display_name: document.getElementById('new-user-display').value,
        email: document.getElementById('new-user-email').value,
        role: document.getElementById('new-user-role').value,
        pin: document.getElementById('new-user-pin').value,
        pin_hash: document.getElementById('new-user-pin').value,
        pin_salt: 'default_salt',
        area: 'GENERAL',
        is_active: true
      };

      const { error } = await _supabase.from('users').insert([newUser]);

      if (error) {
        showError("Error al guardar: " + error.message);
      } else {
        showSuccess("¡Usuario creado exitosamente!");
        e.target.reset();
        await refreshUsers();
        renderUsersTable();
      }
    }

    function renderUsersTable() {
      const tbody = document.getElementById('users-table-body');
      tbody.innerHTML = allUsers.map(u => `
        <tr>
          <td><b>${u.display_name || u.full_name}</b><br><small style="color:#666">${u.email || ''}</small></td>
          <td><span class="badge-role ${u.role === 'ADMIN' ? 'badge-admin' : 'badge-op'}">${u.role}</span></td>
          <td><code>${u.pin || '****'}</code></td>
          <td>
            <button onclick="toggleUserStatus('${u.id}', ${u.is_active !== false})" class="btn-sm btn-danger">
              ${u.is_active !== false ? 'Desactivar' : 'Activar'}
            </button>
          </td>
        </tr>
      `).join('');
    }

    async function toggleUserStatus(userId, currentActive) {
      const { error } = await _supabase.from('users').update({ is_active: !currentActive }).eq('id', userId);
      if (!error) {
        await refreshUsers();
        renderUsersTable();
      }
    }

    function resetFlow() {
      currentPin = "";
      selectedUser = null;
      document.getElementById('main-card').classList.remove('wide');
      document.getElementById('hotel-select').value = "";
      document.getElementById('user-select').value = "";
      document.getElementById('user-select').disabled = true;
      document.getElementById('step-pin').style.display = 'none';
      document.getElementById('step-session').style.display = 'none';
      document.getElementById('step-select').style.display = 'block';
      hideMsgs();
    }

    function showError(msg) {
      const errDiv = document.getElementById('error-msg');
      errDiv.innerText = msg;
      errDiv.style.display = 'block';
    }

    function showSuccess(msg) {
      const succDiv = document.getElementById('success-msg');
      succDiv.innerText = msg;
      succDiv.style.display = 'block';
      setTimeout(() => succDiv.style.display = 'none', 3000);
    }

    function hideMsgs() {
      document.getElementById('error-msg').style.display = 'none';
      document.getElementById('success-msg').style.display = 'none';
    }

    initApp();
  </script>
</body>
</html>
