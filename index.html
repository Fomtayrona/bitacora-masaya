<!-- BARRA DE FILTROS PARA NOVEDADES -->
<div class="filters-bar">
  <div class="form-group" style="margin-bottom:0;">
    <label>Filtrar Estado</label>
    <select id="filter-status" onchange="filterIncidents()">
      <option value="TODOS">Todos los estados</option>
      <option value="PENDIENTE">Pendiente</option>
      <option value="PROCESO">En Proceso</option>
      <option value="RESUELTO">Resuelto</option>
    </select>
  </div>

  <div class="form-group" style="margin-bottom:0;">
    <label>Filtrar Prioridad</label>
    <select id="filter-priority" onchange="filterIncidents()">
      <option value="TODAS">Todas las prioridades</option>
      <option value="BAJA">Baja</option>
      <option value="MEDIA">Media</option>
      <option value="ALTA">Alta</option>
      <option value="CRITICA">🚨 Crítica</option>
    </select>
  </div>

  <div class="form-group" style="margin-bottom:0;">
    <label>Buscar Texto</label>
    <input type="text" id="filter-search" placeholder="Buscar título o detalle..." oninput="filterIncidents()" />
  </div>
</div>
